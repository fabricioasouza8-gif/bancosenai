<DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <title>Gestão Documentos - Banco Senai</title>
        <link rel="stylesheet" href="Documento.css" />
    </head>

    <body>
        <h1>
            Gestão de Documentos
        </h1>

        <div class="form-container">
            <input type="number" id="codigoCliente" placeholder="Código do Cliente" />
            <input type="file" id="arquivo" />
            <button id="btnEnviar" onclick="enviarDocumento()">Enviar</button>
        </div>

        <div class="form-container">
            <input type="number" id="codigoClienteBusca" placeholder="Código do Cliente" />
            <button id="btnBuscar" class="btn-azul" onclick="buscarDocumentos()">Buscar Documentos</button>
        </div>

        <div class="form-container">

        </div>

        <table id="tabelaDocumentos" class="tabela-documentos">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Extensão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                </tbody>
            </table>

                <script src="Documento.js"></script>

    </body>
</html>
